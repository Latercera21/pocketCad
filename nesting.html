<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparrow Nesting — WebAssembly</title>
<style>
  :root { --bg:#10141c; --panel:#1b2230; --line:#2a3345; --text:#e6ebf2; --muted:#8b96a8; --accent:#4da3ff; --ok:#3dd68c; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { display:flex; flex-direction:column; gap:16px; padding:18px 22px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .filebox { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px; border:1px dashed var(--line); border-radius:10px; background:#0d1220; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input { width:110px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:#0d1220; color:var(--text); font-size:13px; }
  input[type="file"] { width:auto; }
  button { padding:9px 16px; border:none; border-radius:8px; background:var(--accent); color:#06101f; font-weight:600; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  #status { font-size:13px; color:var(--muted); }
  #status.running { color:var(--accent); }
  #result { font-size:14px; font-weight:600; }
  #result.ok { color:var(--ok); }
  #result.bad { color:var(--bad); }
  .spinner { display:inline-block; width:14px; height:14px; border:3px solid rgba(77,163,255,.25); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .canvasbox { border:1px solid var(--line); border-radius:10px; background:#0d1220; padding:10px; overflow:auto; -webkit-overflow-scrolling:touch; }
  canvas { display:block; background:#0a0e18; max-width:100%; }

  /* ===== Pantallas pequenas / tactiles (celular) ===== */
  @media (max-width: 520px) {
    body { font-size:16px; }
    header { padding:14px 14px; }
    header h1 { font-size:16px; }
    main { padding:14px; gap:14px; }

    .row { flex-direction:column; align-items:stretch; gap:10px; }
    label { font-size:14px; gap:5px; }
    input { width:100%; font-size:16px; padding:10px 12px; }
    button { width:100%; padding:14px 16px; font-size:16px; }
    button.ghost { width:auto; }

    .filebox { flex-direction:column; align-items:stretch; gap:10px; padding:12px; }
    .filebox button { width:100%; }
    .filebox span { font-size:14px; line-height:1.35; }

    #status { font-size:14px; }
    #result { font-size:15px; line-height:1.4; }
    .spinner { width:16px; height:16px; }

    canvas { max-width:100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Sparrow Nesting — WebAssembly (Emscripten)</h1>
  <p>Motor de anidado 2D compilado a WebAssembly. Puede anidar la pieza incluida o cargar tus propias figuras en JSON.</p>
</header>
<main>
  <div class="row">
    <label>Ancho tela (cm) <input id="telaW" type="number" value="160" step="1"></label>
    <label>Semilla <input id="seed" type="number" value="1" step="1"></label>
    <label>Seg. exploración <input id="tx" type="number" value="30" step="1"></label>
    <label>Seg. compresión <input id="tc" type="number" value="15" step="1"></label>
    <button id="run">Resolver</button>
  </div>

  <div class="filebox">
    <button id="btnFile" class="ghost">Cargar otras piezas (JSON)</button>
    <input id="fileInput" type="file" accept=".json,application/json" style="display:none">
    <span id="fileInfo" style="font-size:13px;color:var(--muted)">Pieza incluida: DAMA-TM-SIEMPRE-W-CIERRE</span>
    <button id="btnReset" class="ghost" style="display:none">Volver a la pieza incluida</button>
  </div>
  <div>
    <div id="status">Preparando...</div>
    <div id="result"></div>
  </div>
  <div class="canvasbox">
    <canvas id="cv"></canvas>
  </div>
</main>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  var statusEl = document.getElementById("status");
  var resultEl = document.getElementById("result");
  var runBtn = document.getElementById("run");
  var btnFile = document.getElementById("btnFile");
  var fileInput = document.getElementById("fileInput");
  var fileInfo = document.getElementById("fileInfo");
  var btnReset = document.getElementById("btnReset");

  // Archivo JSON cargado por el usuario (texto), o null = usar pieza incluida.
  var loadedJson = null;
  var loadedName = null;

  var worker = new Worker("worker.js");
  var solving = false;
  var timerHandle = null;
  var solveStartMs = 0;

  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  worker.onmessage = function (ev) {
    var d = ev.data;
    if (d.type === "phase" && d.phase === "solving") {
      solveStartMs = performance.now();
      if (d.pieces > 0) {
        statusEl.textContent = "Calculando " + d.pieces + " piezas... ";
      } else {
        statusEl.textContent = "Calculando... ";
      }
      statusEl.classList.add("live");
      timerHandle = setInterval(function(){
        var sec = ((performance.now() - solveStartMs) / 1000).toFixed(0);
        statusEl.textContent = "Calculando" + (loadedName ? " " + loadedName : "") + "... " + sec + " s";
      }, 500);
    }
    if (d.type === "result") {
      solving = false;
      runBtn.disabled = false;
      statusEl.classList.remove("live");
      stopTimer();
      draw(d);
    }
  };
  worker.onerror = function (e) {
    solving = false;
    runBtn.disabled = false;
    statusEl.className = "";
    stopTimer();
    statusEl.textContent = "Error del Worker: " + e.message;
    resultEl.className = "bad";
    resultEl.textContent = "Error al ejecutar el motor.";
  };

  function valueOf(id){ return parseFloat(document.getElementById(id).value) || 0; }

  function draw(d) {
    if (d.ok && d.factible) {
      statusEl.className = "";
      statusEl.textContent = "Tiempo real: " + (d.elapsedMs/1000).toFixed(1) + " s (" + (d.source === "file" ? loadedName : "pieza incluida") + ")";
      resultEl.className = "ok";
      resultEl.textContent = "Altura: " + d.largo.toFixed(2) + " cm — factible (perdida " + d.perdida.toFixed(4) + "), " + d.count + " piezas";
    } else if (d.ok) {
      statusEl.className = "";
      statusEl.textContent = "Tiempo real: " + (d.elapsedMs/1000).toFixed(1) + " s";
      resultEl.className = "bad";
      resultEl.textContent = "Altura: " + d.largo.toFixed(2) + " cm — INFACTIBLE (perdida " + d.perdida.toFixed(4) + "). Aumentá el tiempo.";
    } else {
      statusEl.className = "";
      statusEl.textContent = "";
      resultEl.className = "bad";
      resultEl.textContent = "Error: " + (d.error || "desconocido");
    }

    if (!d.ok || !d.largo || d.largo <= 0) {
      canvas.width = 800; canvas.height = 300;
      ctx.fillStyle = "#0a0e18"; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#8b96a8"; ctx.font = "14px sans-serif";
      ctx.fillText("Sin resultado para dibujar.", 20, 40);
      return;
    }

    var telaW = d.telaW;
    var largo = d.largo;
    var pad = 40;
    // Ancho objetivo: cabe en la pantalla/panel, con tope de 900.
    var dispW = window.innerWidth || 800;
    var boxW = canvas.parentNode ? canvas.parentNode.clientWidth : 0;
    var targetW = Math.min(900, Math.max(200, Math.min(dispW, boxW || dispW)));
    var scale = Math.min(targetW / telaW, (targetW * 1.4) / largo);
    scale = Math.min(scale, 8);
    scale = Math.max(scale, 0.1);
    var W = pad*2 + telaW*scale;
    var H = pad*2 + largo*scale;
    canvas.width = Math.max(200, W);
    canvas.height = Math.max(200, H);

    ctx.fillStyle = "#0a0e18"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();
    ctx.translate(pad, pad);
    ctx.scale(scale, scale);

    // contenedor
    ctx.strokeStyle = "#2a3345"; ctx.lineWidth = 0.3/scale;
    ctx.strokeRect(0,0,telaW,largo);

    var colors = ["#e57373","#64b5f6","#81c784","#ffb74d","#ba68c8","#4db6ac","#f06292","#a1887f"];
    for (var i = 0; i < (d.pieces||[]).length; i++) {
      var pts = d.pieces[i];
      if (!pts || pts.length < 6) continue;
      ctx.beginPath();
      ctx.moveTo(pts[0], pts[1]);
      for (var k = 2; k < pts.length; k += 2) ctx.lineTo(pts[k], pts[k+1]);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.globalAlpha = 0.6; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#000"; ctx.lineWidth = 0.15/scale; ctx.stroke();
      // etiqueta
      ctx.fillStyle = "#0a0e18"; ctx.font = (4/scale)+"px sans-serif";
      ctx.fillText(String(i), pts[0]+1, pts[1]+4);
    }
    ctx.restore();
  }

  // ---- Seleccion de archivo ----
  btnFile.addEventListener("click", function(){ fileInput.click(); });

  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      loadedJson = String(reader.result);
      loadedName = f.name;
      fileInfo.textContent = "Piezas cargadas: " + f.name;
      btnReset.style.display = "inline-block";
      resultEl.className = "";
      resultEl.textContent = "";
      statusEl.className = "";
      statusEl.textContent = "Archivo '" + f.name + "' listo. Presioná Resolver.";
    };
    reader.onerror = function(){
      loadedJson = null; loadedName = null;
      fileInfo.textContent = "No se pudo leer el archivo.";
    };
    reader.readAsText(f);
  });

  btnReset.addEventListener("click", function(){
    loadedJson = null;
    loadedName = null;
    fileInput.value = "";
    btnReset.style.display = "none";
    fileInfo.textContent = "Pieza incluida: DAMA-TM-SIEMPRE-W-CIERRE";
    resultEl.className = "";
    resultEl.textContent = "";
    statusEl.className = "";
    statusEl.textContent = "Listo. Presioná Resolver para anidar las piezas.";
  });

  runBtn.addEventListener("click", function(){
    if (solving) return;
    solving = true;
    runBtn.disabled = true;
    statusEl.className = "running";
    statusEl.classList.add("live");
    statusEl.innerHTML = "<span class='spinner'></span>Arrancando el motor...";
    resultEl.textContent = "";
    var msg = {
      type: "solve",
      telaW: valueOf("telaW"),
      seed: Math.floor(valueOf("seed")),
      tExplorar: valueOf("tx"),
      tComprimir: valueOf("tc")
    };
    // El texto del JSON se envia al worker solo si el usuario cargo un archivo.
    if (loadedJson !== null) msg.jsonText = loadedJson;
    worker.postMessage(msg);
  });

  statusEl.textContent = "Listo. Presioná Resolver para anidar las piezas.";
})();
</script>
</body>
</html>
